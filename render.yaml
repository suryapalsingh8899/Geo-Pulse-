services:
  # 1. Backend Web Service
  - type: web
    name: geopulse-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: CLIENT_URL
        value: "*"

  # 2. Frontend Static Site
  - type: web
    name: geopulse-frontend
    runtime: static
    rootDir: frountend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://geopulse-backend.onrender.com/api
